steps:
  update-jointhefreeworld:
    image: curlimages/curl
    when:
      - event: [push]
        branch: [trunk]
    environment:
      BYGGSTEG_KEY:
        from_secret: BYGGSTEG_KEY
    commands: |
      curl 'https://byggsteg.jointhefreeworld.org/api/v1/jobs/manage/submit' \
        -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
        --data-urlencode 'username=Joe' \
        --data-urlencode "password=$BYGGSTEG_KEY" \
        --data-urlencode 'job-code=(lambda() `((project . "lucidplan")(branch-name . "trunk")(task . ("pull-and-restart" "pull-and-deploy"))(daemon-name . "lucidplan-daemon")(clone-url . "https://codeberg.org/jjba23/lucidplan")))'

