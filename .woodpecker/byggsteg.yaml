steps:
  update-byggsteg-trigger-jointhefreeworld:
    image: "jjba23/byggsteg-woodpecker:0.0.7"
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]
    settings:
      BYGGSTEG_USERNAME:
        from_secret: "BYGGSTEG_USERNAME"
      BYGGSTEG_KEY:
        from_secret: "BYGGSTEG_KEY"      
      BYGGSTEG_URL: "https://byggsteg.jointhefreeworld.org"
      BYGGSTEG_JOB_CODE: |
        (lambda()
          `((task . ("pull-and-restart" "pull-and-deploy"))
            (daemon-name . "lucidplan-daemon")
            (project . "%%CI_REPO_NAME%%")
            (branch-name . "%%CI_COMMIT_BRANCH%%")            
            (clone-url . "%%CI_REPO_CLONE_URL%%")))      

